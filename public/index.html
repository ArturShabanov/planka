<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2B2B2E">
<title>Планка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
/* Layout: dark sidebar + dark board area; light status columns with a colored cap; white task cards. Single deliberate look. */
:root{
  color-scheme:dark;
  --chrome:#2B2B2E; --chrome-2:#1F1F22; --chrome-line:#3A3A3E; --chrome-hover:#38383C; --chrome-sel:#55555B;
  --chrome-fg:#EDEDEF; --chrome-muted:#9B9BA2;
  --col-bg:#ECEEF2; --card:#FFFFFF; --card-line:#E1E4EA; --ink:#2C3038; --ink-muted:#8B919C;
  --chip:#F2F3F6; --chip-line:#E2E5EA; --link:#3B7BE8; --done:#3EBF6C; --danger:#E0533F; --danger-soft:#FDE7E3; --warn:#E59A1F;
  --f-body:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:ui-monospace,Menlo,monospace;
}
html,body{height:100%}
body{margin:0}
.card{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.touch-ghost{position:fixed;left:0;top:0;z-index:90;pointer-events:none;box-shadow:0 12px 30px rgba(0,0,0,.35);opacity:.95}
[hidden]{display:none!important}
body{background:var(--chrome-2);color:var(--chrome-fg);font-family:var(--f-body);font-size:14px;line-height:1.4;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--link);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:270px minmax(0,1fr);height:100%}

/* sidebar */
.side{background:var(--chrome);border-right:1px solid var(--chrome-line);display:flex;flex-direction:column;min-height:0;padding-block:16px 14px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:10px;gap:6px}
.brand{display:flex;align-items:center;gap:10px;font-weight:500;font-size:15px;padding:6px 12px 12px}
.brand i{width:24px;height:24px;border-radius:50%;background:var(--link);display:inline-grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;color:#fff}
.side-label{display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:15px}
.side-label .ibtn{margin-left:auto}
.plist{display:flex;flex-direction:column;gap:2px;overflow-y:auto;min-height:0;flex:1}
.pitem{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 42px;border-radius:8px;text-align:left;width:100%;font-size:15px}
.pitem:hover{background:var(--chrome-hover)}
.pitem.on{background:var(--chrome-sel)}
.pitem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem .ct{font-size:12px;color:var(--chrome-muted);font-variant-numeric:tabular-nums}
.pitem.on .ct{color:var(--chrome-fg)}
.store-note{font-size:12px;color:var(--chrome-muted);padding:8px 12px 0;border-top:1px solid var(--chrome-line);display:flex;gap:8px;align-items:flex-start}
.store-note::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--done);margin-top:5px;flex:none}
.store-note.local::before{background:var(--warn)}

/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--chrome);padding-block:14px;padding-left:24px;padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--chrome-line)}
.ptitle{display:flex;align-items:center;gap:6px;min-width:0}
.ptitle h1{font-weight:500;font-size:17px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search{display:flex;align-items:center;gap:8px;background:var(--chrome-2);border:1px solid var(--chrome-line);border-radius:8px;padding:7px 12px;width:270px;max-width:100%;color:var(--chrome-muted)}
.search input{border:0;background:none;outline:none;width:100%;min-width:0;color:var(--chrome-fg)}
.search input::placeholder{color:var(--chrome-muted)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:14px 12px;padding-left:24px;padding-right:max(16px,env(safe-area-inset-right,0px))}
.tb-group{display:flex;align-items:center;gap:4px;background:var(--col-bg);color:var(--ink);border-radius:8px;padding:4px}
.tb-item{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:6px;font-size:13px;color:var(--ink-muted);font-variant-numeric:tabular-nums}
.tb-item.on{background:var(--card);color:var(--link);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.bar{width:90px;height:5px;border-radius:3px;background:var(--card-line);overflow:hidden}
.bar b{display:block;height:100%;background:var(--done);border-radius:3px;transition:width .3s}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:7px;color:var(--chrome-muted)}
.ibtn:hover{background:var(--chrome-hover);color:var(--chrome-fg)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;font-weight:500;border:1px solid var(--card-line);background:var(--card);color:var(--ink)}
.btn:hover{border-color:var(--ink-muted)}
.btn.primary{background:var(--link);color:#fff;border-color:var(--link)}
.btn.danger{color:var(--danger);border-color:transparent;background:var(--danger-soft)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-muted)}
.btn.ghost:hover{color:var(--ink);background:var(--chip)}

.board{flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;display:flex;gap:10px;align-items:flex-start;padding-block:0 16px;padding-left:24px;padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{flex:0 0 340px;max-height:100%;display:flex;flex-direction:column;background:var(--col-bg);border-radius:12px;min-height:0;color:var(--ink);color-scheme:light;border-top:6px solid var(--c);overflow:hidden}
.col-h{background:color-mix(in srgb,var(--c) 14%,var(--col-bg));padding:14px 10px 10px 18px;display:flex;flex-direction:column;gap:6px}
.col-h .r1{display:flex;align-items:center;gap:8px}
.col-h h2{font-size:19px;font-weight:500;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-n{font-size:12px;color:var(--ink-muted);font-variant-numeric:tabular-nums}
.col .ibtn{color:var(--ink-muted)}
.col .ibtn:hover{background:rgba(0,0,0,.06);color:var(--ink)}
.add-task{display:inline-flex;align-items:center;gap:6px;color:var(--link);font-size:16px;align-self:flex-start;padding:2px 0}
.add-task:hover{text-decoration:underline}
.cards{display:flex;flex-direction:column;gap:8px;padding:10px 10px 12px;overflow-y:auto;min-height:40px}
.card{background:var(--card);border:1px solid var(--card-line);border-radius:10px;padding:12px 10px 12px 12px;cursor:pointer;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(20,25,35,.06)}
.card:hover{box-shadow:0 3px 10px rgba(20,25,35,.12)}
.card.dragging{opacity:.35}
.card .r1{display:flex;align-items:flex-start;gap:8px}
.ck{width:18px;height:18px;border-radius:50%;border:1.5px solid #C5CAD3;flex:none;margin-top:1px;display:inline-grid;place-items:center;color:#fff}
.ck:hover{border-color:var(--done)}
.ck.on{background:var(--done);border-color:var(--done)}
.card .ttl{flex:1;min-width:0;font-size:15px;color:var(--ink);overflow-wrap:anywhere}
.card.is-done .ttl{color:var(--ink-muted)}
.card .ibtn{width:22px;height:22px;margin-top:-1px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-left:26px;font-size:12px;color:var(--ink-muted)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:6px;background:var(--chip);border:1px solid var(--chip-line);font-variant-numeric:tabular-nums}
.chip.over{color:var(--danger);border-color:#F6C3BA;background:var(--danger-soft)}
.num{font-family:var(--f-mono);font-size:11px}
.prio i{display:inline-flex;gap:1.5px;align-items:flex-end;height:10px}
.prio i b{width:3px;border-radius:1px;background:#C9CED6}
.prio i b:nth-child(1){height:4px}.prio i b:nth-child(2){height:7px}.prio i b:nth-child(3){height:10px}
.prio.p1 i b:nth-child(-n+1),.prio.p2 i b:nth-child(-n+2),.prio.p3 i b{background:var(--warn)}
.prio.p4 i b{background:var(--danger)}
.prio.p4{color:var(--danger);font-weight:500}
.drop-ph{height:4px;border-radius:2px;background:var(--link);margin:-2px 0}
.qa{display:flex;flex-direction:column;gap:6px}
.qa textarea{width:100%;resize:none;border:1px solid var(--link);border-radius:10px;padding:10px 12px;background:var(--card);outline:none;min-height:60px;color:var(--ink)}
.qa .row{display:flex;gap:6px}
.col-add{flex:0 0 230px;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:10px;background:var(--col-bg);color:var(--ink);font-weight:500;font-size:15px}
.col-add:hover{background:#fff}

/* empty + loading */
.empty{margin:auto;max-width:440px;text-align:center;padding:40px 16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty h2{font-weight:500;font-size:20px;margin:0;text-wrap:balance}
.empty p{color:var(--chrome-muted);margin:0}
.ghostboard{display:flex;gap:8px;margin-bottom:8px}
.ghostboard div{width:58px;border-radius:8px;background:var(--chrome);border-top:4px solid var(--c);display:flex;flex-direction:column;gap:4px;padding:5px}
.ghostboard span{height:10px;border-radius:3px;background:var(--chrome-sel)}

/* popover + modal (light, like the columns) */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(5vh,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));z-index:50;overflow-y:auto}
.modal{background:var(--card);color:var(--ink);color-scheme:light;border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.4);display:flex;flex-direction:column}
.modal.sm{max-width:420px}
.modal .ibtn,.pop .ibtn{color:var(--ink-muted)}
.modal .ibtn:hover,.pop .ibtn:hover{background:var(--chip);color:var(--ink)}
.m-head{display:flex;align-items:center;gap:8px;padding:12px 12px 0 18px}
.m-head h2{font-weight:500;font-size:17px;margin:0;flex:1}
.m-body{padding:10px 18px 18px;display:flex;flex-direction:column;gap:16px}
.m-title{width:100%;border:0;background:none;resize:none;font-weight:500;font-size:20px;line-height:1.3;outline:none;padding:4px 0;overflow:hidden;color:var(--ink)}
.m-title:focus{box-shadow:0 2px 0 var(--link)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.sec-l{font-size:12px;color:var(--ink-muted)}
.inp{width:100%;border:1px solid var(--card-line);background:var(--chip);border-radius:8px;padding:7px 9px;outline:none;min-width:0;color:var(--ink)}
.inp:focus{border-color:var(--link);background:var(--card)}
textarea.inp{resize:vertical;min-height:96px}
.keychip{font-family:var(--f-mono);font-size:11px;padding:2px 6px;border-radius:5px;background:var(--chip);border:1px solid var(--chip-line);color:var(--ink-muted)}
.chk{display:flex;flex-direction:column;gap:2px}
.chk-row{display:flex;align-items:center;gap:8px;padding:4px;border-radius:6px}
.chk-row:hover{background:var(--chip)}
.chk-row input[type=checkbox]{accent-color:var(--done);width:16px;height:16px;flex:none}
.chk-row .txt{flex:1;min-width:0;border:0;background:none;outline:none;padding:2px 0;color:var(--ink)}
.chk-row.dn .txt{text-decoration:line-through;color:var(--ink-muted)}
.chk-row .ibtn{width:24px;height:24px;opacity:0}
.chk-row:hover .ibtn,.chk-row .ibtn:focus-visible{opacity:1}
.sec-h{display:flex;justify-content:space-between;align-items:center}
.m-foot{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:12px 18px;border-top:1px solid var(--card-line);color:var(--ink-muted);font-size:12px;flex-wrap:wrap}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:22px;height:22px;border-radius:6px;background:var(--c);border:2px solid transparent}
.sw.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--c)}
.tpls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tpl{border:1px solid var(--card-line);border-radius:10px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:6px}
.tpl.on{border-color:var(--link);background:#EEF4FE}
.tpl small{color:var(--ink-muted);font-size:12px}
.pop{position:fixed;z-index:60;background:var(--card);color:var(--ink);color-scheme:light;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.35);padding:10px;width:250px;display:flex;flex-direction:column;gap:8px}
.pop .mi{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;text-align:left;width:100%}
.pop .mi:hover:not(:disabled){background:var(--chip)}
.pop .mi.red{color:var(--danger)}
.pop hr{border:0;border-top:1px solid var(--card-line);margin:2px 0}
.toggle{display:flex;align-items:center;gap:8px;padding:6px 8px;font-size:13px;cursor:pointer}
.toggle input{accent-color:var(--done)}
.confirm{background:var(--danger-soft);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--ink)}
.confirm .row{display:flex;gap:6px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--card);color:var(--ink);padding:10px 14px;border-radius:10px;font-size:13px;z-index:80;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.4)}
.banner{margin:0 24px 10px;padding:8px 12px;border-radius:8px;background:var(--danger-soft);color:var(--danger);font-size:13px}

.linkbtn{color:var(--link);font-size:13px}
.linkbtn:hover{text-decoration:underline}
.linkbtn.red{color:var(--danger)}
.store-note .linkbtn{color:var(--chrome-muted)}
.digest{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--chrome-muted);padding:0 12px;cursor:pointer}
.digest input{accent-color:var(--done)}
.members{display:flex;flex-direction:column;gap:6px}
.mem{display:flex;align-items:center;gap:10px}
.ava{width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:500;flex:none}
.mem-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.mem-n small{display:block;color:var(--ink-muted);font-size:12px}
.role{font-size:12px;color:var(--ink-muted);background:var(--chip);border:1px solid var(--chip-line);border-radius:6px;padding:2px 7px}
.invite{display:flex;flex-direction:column;gap:8px}
.invite:empty{display:none}
.inv-row{display:flex;gap:6px}
.inv-row .inp{flex:1}
.pitem .ct span{vertical-align:middle}
.empty a.btn{text-decoration:none}
.fab{display:none}
.sheet-title{font-size:17px;min-height:84px;resize:none}
@media (max-width:760px), (pointer:coarse){
  .fab{display:flex;position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--link);color:#fff;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.45);z-index:40}
  .fab:active{transform:scale(.95)}
}
@media (max-width:760px){
  .top{padding-block:8px;gap:8px}
  .ptitle h1{font-size:16px}
  .toolbar{padding-block:8px}
  .toolbar .tb-group:first-child{display:none}
  .board{padding-bottom:96px}
  .scrim{padding-top:max(12px,env(safe-area-inset-top,0px))}
  .m-foot .btn{flex:1;justify-content:center;padding-block:11px}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .side{border-right:0;border-bottom:1px solid var(--chrome-line);padding-block:8px;padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:max(16px,env(safe-area-inset-left,0px));flex-direction:row;align-items:center}
  .brand,.store-note,.digest,.side-label .lbl{display:none}
  .side-label{padding:0;order:2}
  .plist{flex-direction:row;overflow-x:auto;overflow-y:hidden;gap:6px;flex:1 1 0;min-width:0;touch-action:pan-x;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}
  .plist::-webkit-scrollbar{display:none}
  .side{overflow:hidden}
  .side-label{flex:none}
  .pitem{width:auto;flex:none;padding:6px 12px;font-size:14px}
  .pitem .nm{max-width:140px}
  .top,.toolbar,.board{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .col{flex-basis:84vw;max-width:340px}
  .search{width:100%}
  .fields{grid-template-columns:1fr 1fr}
  .banner{margin-inline:16px}
  input,select,textarea{font-size:16px!important}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  projects: new Map(), tasks: new Map(), pending: new Map(), running: new Set(), login: null,
  async api(method, url, body) {

    let j = {}; try { j = await r.json(); } catch {}

    this.loadCache(); render();
    if (inTg && !this.token) {

    }

    await this.afterLogin();
  },
  setToken(t) { this.token = t; ls.set(TOKEN_KEY, t); },
  async startLogin() {
    this.mode = 'login'; this.ready = true; this.projects = new Map(); this.tasks = new Map(); render();
    try {
      const { code, url } = await this.api('POST', '/api/auth/link');
      this.login = { code, url }; render();
      const poll = async () => {
        if (this.mode !== 'login' || !this.login || this.login.code !== code) return;
        try {
          const r = await this.api('GET', '/api/auth/link/' + code);
          if (r.token) { this.setToken(r.token); this.login = null; await this.afterLogin(); return; }
        } catch (e) { if (e.status === 410) { this.startLogin(); return; } }

  async afterLogin() {

        h('div', { class: 'field' }, h('label', { for: 'tm-col' }, 'Статус'), h('select', { class: 'inp', id: 'tm-col', onchange: e => { const cur = store.tasks.get(t.id); const inCol = store.tasksOf(p.id).filter(x => x.columnId === e.target.value); patchTask({ columnId: e.target.value, order: inCol.reduce((m, x) => Math.max(m, x.order || 0), 0) + 1000 }); } },
          p.columns.map(c => h('option', { value: c.id, selected: c.id === t.columnId }, c.name)))),
        h('div', { class: 'field' }, h('label', { for: 'tm-prio' }, 'Приоритет'), h('select', { class: 'inp', id: 'tm-prio', onchange: e => patchTask({ priority: +e.target.value }) }, PRIOS.map(([n, v]) => h('option', { value: v, selected: v === (t.priority || 0) }, n)))),
        h('div', { class: 'field' }, h('label', { for: 'tm-due' }, 'Срок'), h('input', { class: 'inp', id: 'tm-due', type: 'date', value: t.due || '', onchange: e => patchTask({ due: e.target.value }) })),
        h('div', { class: 'field' }, h('label', { for: 'tm-remind' }, 'Напомнить в Telegram'), h('input', { class: 'inp', id: 'tm-remind', type: 'datetime-local', value: toLocalInput(t.remindAt), onchange: e => patchTask({ remindAt: fromLocalInput(e.target.value) }) }))),
      h('div', { class: 'field' }, h('label', { for: 'tm-desc' }, 'Описание'), h('textarea', { class: 'inp', id: 'tm-desc', placeholder: 'Детали, ссылки, заметки', value: t.desc || '',
        oninput: e => { clearTimeout(descT); const v = e.target.value; descT = setTimeout(() => patchTask({ desc: v }), 600); }, onblur: e => { clearTimeout(descT); if (e.target.value !== (store.tasks.get(t.id)?.desc || '')) patchTask({ desc: e.target.value }); } })),
      h('div', { class: 'field' }, h('div', { class: 'sec-h' }, h('span', { class: 'sec-l' }, 'Чек-лист'), h('span', { class: 'num', id: 'tm-chk-n', style: 'color:var(--ink-muted)' })), chk,
        h('input', { class: 'inp', id: 'tm-chk-add', placeholder: '+ Добавить пункт и нажать Enter', onkeydown: e => { if (e.key === 'Enter') { e.preventDefault(); const v = e.target.value.trim(); if (!v) return; const cur = store.tasks.get(t.id); patchTask({ checklist: [...(cur.checklist || []), { id: uid(), text: v, done: false }] }); e.target.value = ''; } } })),
      delZone),
    h('div', { class: 'm-foot' }, h('span', null, 'Создана ' + new Date(t.createdAt).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' })),

        h('button', { class: 'btn danger', onclick: () => { const cur = store.tasks.get(t.id); closeModal(); if (cur) store.delTask(cur); } }, 'Удалить')))) }, svg(IC.trash, 15), 'Удалить')));
  drawChecklist();
  requestAnimationFrame(() => autosize(title));
}
function drawChecklist() {
  const t = store.tasks.get(ui.openTask); const chk = $('#tm-chk'); if (!t || !chk) return;
  const list = t.checklist || [];
  $('#tm-chk-n').textContent = list.length ? `${list.filter(c => c.done).length}/${list.length}` : '';
  const setList = fn => { const cur = store.tasks.get(t.id); patchTask({ checklist: fn(cur.checklist || []) }); };
  chk.replaceChildren(...list.map(item => h('div', { class: 'chk-row' + (item.done ? ' dn' : '') },
    h('input', { type: 'checkbox', id: 'ck-' + item.id, checked: item.done, 'aria-label': item.text, onchange: e => setList(l => l.map(c => c.id === item.id ? { ...c, done: e.target.checked } : c)) }),
    h('input', { class: 'txt', id: 'ckt-' + item.id, value: item.text, 'aria-label': 'Текст пункта', onchange: e => { const v = e.target.value.trim(); setList(l => v ? l.map(c => c.id === item.id ? { ...c, text: v } : c) : l.filter(c => c.id !== item.id)); } }),
    h('button', { class: 'ibtn', 'aria-label': 'Удалить пункт', onclick: () => setList(l => l.filter(c => c.id !== item.id)) }, svg(IC.x, 14)))));
}
function refreshTaskModal() {
  // keep what the user is typing; refresh only fields not in focus
  const t = store.tasks.get(ui.openTask); if (!t) { closeModal(); return; }
  const a = document.activeElement;
  const set = (id, v) => { const el = $('#' + id); if (el && el !== a && el.value !== v) el.value = v; };
  set('tm-title', t.title); set('tm-col', t.columnId); set('tm-prio', String(t.priority || 0)); set('tm-due', t.due || ''); set('tm-remind', toLocalInput(t.remindAt)); set('tm-desc', t.desc || '');
  if (!(a && a.closest && a.closest('#tm-chk'))) drawChecklist();

addEventListener('resize', closePop);

/* ---------- phone: add-task sheet + hide keyboard on outside tap ---------- */
function isPhone() { return matchMedia('(max-width:760px), (pointer:coarse)').matches; }
function openAddSheet(p, colId) {
  const open = p.columns.find(c => !c.done) || p.columns[0];
  const st = { col: colId || open.id, prio: 0, due: '' };
  const ta = h('textarea', { class: 'inp sheet-title', id: 'as-title', rows: 3, placeholder: 'Что нужно сделать?', enterkeyhint: 'done', 'aria-label': 'Название задачи',
    onkeydown: e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); add(false); } } });
  const add = more => {
    const title = ta.value.trim(); if (!title) { ta.focus(); return; }
    createTask(store.projects.get(p.id) || p, st.col, title, { priority: st.prio, due: st.due, remindAt: st.remindAt || '' });
    const col = p.columns.find(c => c.id === st.col);
    toast(`Добавлено в «${col ? col.name : ''}»`);
    if (more) { ta.value = ''; st.remindAt = ''; const r = $('#as-remind'); if (r) r.value = ''; ta.focus(); } else closeModal();
  };
  openModal(h('div', null,
    h('div', { class: 'm-head' }, h('h2', null, 'Новая задача'), h('button', { type: 'button', class: 'ibtn', 'aria-label': 'Закрыть', onclick: closeModal }, svg(IC.x))),
    h('div', { class: 'm-body' }, ta,
      h('div', { class: 'fields' },
        h('div', { class: 'field' }, h('label', { for: 'as-col' }, 'Колонка'), h('select', { class: 'inp', id: 'as-col', onchange: e => st.col = e.target.value }, p.columns.map(c => h('option', { value: c.id, selected: c.id === st.col }, c.name)))),
        h('div', { class: 'field' }, h('label', { for: 'as-prio' }, 'Приоритет'), h('select', { class: 'inp', id: 'as-prio', onchange: e => st.prio = +e.target.value }, PRIOS.map(([n, v]) => h('option', { value: v }, n)))),
        h('div', { class: 'field' }, h('label', { for: 'as-due' }, 'Срок'), h('input', { class: 'inp', id: 'as-due', type: 'date', onchange: e => st.due = e.target.value })),
        h('div', { class: 'field' }, h('label', { for: 'as-remind' }, 'Напомнить'), h('input', { class: 'inp', id: 'as-remind', type: 'datetime-local', onchange: e => st.remindAt = fromLocalInput(e.target.value) })))),
    h('div', { class: 'm-foot' },
      h('button', { type: 'button', class: 'btn keep-kb', onclick: () => add(true) }, 'Добавить ещё'),
      h('button', { type: 'button', class: 'btn primary', onclick: () => add(false) }, 'Добавить'))), 'sm sheet');
  ta.focus();
}
// tapping anywhere outside a text field closes the on-screen keyboard
document.addEventListener('touchstart', e => {
  const a = document.activeElement;
  if (!a || !/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
  if (e.target.closest('input, textarea, select, label, .keep-kb')) return;
  a.blur();
}, { passive: true, capture: true });

store.init();
